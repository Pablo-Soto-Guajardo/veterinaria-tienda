spring.application.name=veterinaria-tienda

server.port=8082

# Conexion a MySQL. Los valores reales llegan por variables de entorno (Guia 15).
spring.datasource.url=${TIENDA_DB_URL:jdbc:mysql://localhost:3306/veterinaria_tienda?createDatabaseIfNotExist=true}
spring.datasource.username=${TIENDA_DB_USER:root}
spring.datasource.password=${TIENDA_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Mismo secreto que Auth (variable JWT_SECRET) y mismo emisor (Guia 17).
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=veterinaria-auth

app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
