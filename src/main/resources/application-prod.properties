# Perfil de produccion (Guia 18). Se activa con SPRING_PROFILES_ACTIVE=prod.
server.address=127.0.0.1
server.port=8082
spring.datasource.url=${TIENDA_DB_URL}
spring.datasource.username=${TIENDA_DB_USER}
spring.datasource.password=${TIENDA_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=veterinaria-auth
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN}